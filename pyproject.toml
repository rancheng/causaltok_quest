[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causaltok-quest"
version = "0.2.0"
description = "Public candidate kit for the CausalTok math + coding quest"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
causaltok = "causaltok.cli:main"

[tool.setuptools]
packages = ["causaltok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
