name: public-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .[dev]
      - run: pytest -q
      - run: python -m causaltok.cli list-worlds
      - run: python -m causaltok.cli export-world texture --size 8 --out /tmp/world.json
      - run: python -m causaltok.cli inspect /tmp/world.json
